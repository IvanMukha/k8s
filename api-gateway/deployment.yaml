apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: inno
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      initContainers:
        - name: wait-for-keycloak
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z keycloak 8080; do echo waiting for keycloak; sleep 3; done']
        - name: wait-for-user-service
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z user-service 8080; do echo waiting for user-service; sleep 3; done']
        - name: wait-for-auth-service
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z auth-service 8081; do echo waiting for auth-service; sleep 3; done']
        - name: wait-for-order-service
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z order-service 8083; do echo waiting for order-service; sleep 3; done']
        - name: wait-for-payment-service
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z payment-service 8084; do echo waiting for payment-service; sleep 3; done']
      containers:
        - name: api-gateway
          image: api-gateway:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
          envFrom:
            - configMapRef:
                name: gateway-config
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 640Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
